site_name: xp-genomic-tools
site_description: User docs for RGTools and companion CLIs (GenomicElementTools, ExogeneousSequenceTools, and MotifTools 0.3.0a4)
site_url: https://dignomor.github.io/xp-genomic-tools-docs/
repo_url: https://github.com/DignoMor/xp-genomic-tools
repo_name: DignoMor/xp-genomic-tools

exclude_docs: |
  reference/cli/authored/
  reference/cli/fragments/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../code/src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            docstring_style: google
  - redirects:
      redirect_maps:
        reference/cli/generated/genomic-element-tools.md: reference/cli/genomic-element-tools/index.md
        reference/cli/generated/exogeneous-sequence-tools.md: reference/cli/exogeneous-sequence-tools/index.md
        reference/cli/generated/motif-tools.md: reference/cli/motif-tools/index.md
        reference/cli/mask-op-intersect.md: reference/cli/genomic-element-tools/mask-op/intersect.md

nav:
  - Home: index.md
  - Install: install.md
  - Concepts: concepts.md
  - Guides:
      - TSS-relative mutagenesis: guides/tss-relative-mutagenesis.md
  - Formats: formats.md
  - CLI:
      - Overview: cli/index.md
      - GenomicElementTools: cli/GenomicElementTools.md
      - ExogeneousSequenceTools: cli/ExogeneousSequenceTools.md
      - MotifTools: cli/MotifTools.md
  - Library (RGTools): library.md
  - Reference:
      - Convention: reference/conventions.md
      - Python:
          - Grouped index: reference/python/index.md
          - Alphabetical index: reference/python/alphabetical-index.md
          - Element collections:
              - Overview: reference/python/elements/index.md
              - GeneralElements: reference/python/general-elements/general-elements.md
              - GenomicElements: reference/python/elements/genomic-elements.md
              - ExogeneousSequences: reference/python/elements/exogeneous-sequences.md
          - Operations:
              - GeneralElements.load_mask_from_arr(): reference/python/general-elements/load-mask-from-arr.md
          - MemeMotif: reference/python/motifs/meme-motif.md
          - MotifGeneration: reference/python/motifs/motif-generation.md
          - TSSRelativeCoordinates: reference/python/general-elements/tss-relative-coordinates.md
