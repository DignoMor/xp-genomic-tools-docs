          - bed6poly: reference/formats/cli/genomic-element-tools/bed6poly.md
          - WTES: reference/formats/cli/genomic-element-tools/wtes.md
          - GenomicElementTools (generated): reference/cli/generated/genomic-element-tools.md
          - ExogeneousSequenceTools (generated): reference/cli/generated/exogeneous-sequence-tools.md
          - MotifTools (generated): reference/cli/generated/motif-tools.md
          - ExogeneousSequenceTools reference: reference/cli/exogeneous-sequence-tools/index.md
          - MotifTools reference: reference/cli/motif-tools/index.md
      - ExogeneousSequenceTools formats:
          - Exogenous FASTA: reference/formats/cli/exogeneous-sequence-tools/exogenous-fasta.md
          - Assembly outputs: reference/formats/cli/exogeneous-sequence-tools/assembly-outputs.md
          - Mutagenesis: reference/formats/cli/exogeneous-sequence-tools/mutagenesis.md
