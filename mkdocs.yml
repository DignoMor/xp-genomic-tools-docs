site_name: xp-genomic-tools
site_description: User docs for RGTools and companion CLIs (GenomicElementTools, ExogeneousSequenceTools, and MotifTools 0.3.0a2)
site_url: https://dignomor.github.io/xp-genomic-tools-docs/
repo_url: https://github.com/DignoMor/xp-genomic-tools
repo_name: DignoMor/xp-genomic-tools

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Concepts: concepts.md
  - Guides:
      - TSS-relative mutagenesis: guides/tss-relative-mutagenesis.md
  - Formats: formats.md
  - CLI:
      - Overview: cli/index.md
      - GenomicElementTools: cli/GenomicElementTools.md
      - ExogeneousSequenceTools: cli/ExogeneousSequenceTools.md
      - MotifTools: cli/MotifTools.md
  - Library (RGTools): library.md
  - Reference:
      - Convention: reference/conventions.md
      - Python:
          - Element collections:
              - Overview: reference/python/elements/index.md
          - Operations:
              - GeneralElements.load_mask_from_arr(): reference/python/general-elements/load-mask-from-arr.md
          - MemeMotif: reference/python/motifs/meme-motif.md
          - MotifGeneration: reference/python/motifs/motif-generation.md
          - TSSRelativeCoordinates: reference/python/general-elements/tss-relative-coordinates.md
          - BigWig signal tracks: reference/python/signal/bw-track.md
          - GENCODE GTF streaming: reference/python/gtf/gtf-utils.md
          - EnsemblRestSearch: reference/python/snp/ensembl-rest-search.md
          - Foundation exceptions: reference/python/foundation/exceptions.md
          - Foundation Logger: reference/python/foundation/logger.md
          - Foundation utilities: reference/python/foundation/utils.md
          - ListFile: reference/python/foundation/list-file.md
          - BedRegion: reference/python/bedtable/bed-region.md
          - BedTableIterator: reference/python/bedtable/iterator.md
          - BedTable3: reference/python/bedtable/bed-table3.md
          - BedTable6: reference/python/bedtable/bed-table6.md
          - BedTable Plus: reference/python/bedtable/bed-table-plus.md
          - BedTablePairEnd (experimental): reference/python/bedtable/bed-table-pair-end.md
      - Formats:
          - Boolean mask: reference/formats/boolean-mask.md
          - FASTA: reference/formats/elements/fasta.md
          - Annotation arrays: reference/formats/elements/annotation-arrays.md
          - MEME motif: reference/formats/motifs/meme.md
          - BigWig signal: reference/formats/signal/bigwig.md
          - GENCODE GTF: reference/formats/gtf/gencode.md
          - Ensembl SNP simple info: reference/formats/snp/ensembl-simple-info.md
          - BED-like region tables: reference/formats/foundation/bed-like.md
          - bed3: reference/formats/foundation/bed3.md
          - bed6: reference/formats/foundation/bed6.md
          - bed3gene: reference/formats/foundation/bed3gene.md
          - bed6gene: reference/formats/foundation/bed6gene.md
          - narrowPeak: reference/formats/foundation/narrowpeak.md
          - TREbed: reference/formats/foundation/trebed.md
          - bedGraph: reference/formats/foundation/bedgraph.md
          - BedTablePairEnd format (experimental): reference/formats/foundation/pair-end.md
          - ListFile format: reference/formats/foundation/list-file.md
      - CLI:
          - mask_op intersect: reference/cli/mask-op-intersect.md
          - GenomicElementTools reference: reference/cli/genomic-element-tools/index.md
      - CLI output formats:
          - CountTable: reference/formats/cli/genomic-element-tools/counttable.md
